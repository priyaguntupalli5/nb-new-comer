# SAM CLI defaults for `sam deploy`. Secrets are passed with --parameter-overrides by the
# deploy workflow; nothing sensitive belongs in this file.
version = 0.1

[default.deploy.parameters]
stack_name = "nb-newcomer-guide"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
# Applied to every resource in the stack, so AWS Budgets can track this project's costs separately.
tags = "project=nb-newcomer-guide"
