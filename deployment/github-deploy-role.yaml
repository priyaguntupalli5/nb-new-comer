AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time setup: lets GitHub Actions deploy the nb-newcomer-guide stack using short-lived OIDC
  credentials (no AWS keys stored in GitHub). Only workflows on the main branch of the given
  repository can assume the role. Deploy once from the CloudFormation console with an admin login.

Parameters:
  GitHubRepo:
    Type: String
    Default: priyaguntupalli5/nb-new-comer
    Description: owner/repo allowed to assume the role
  # GitHub puts these IDs in the OIDC subject for this account: repo:<owner>@<ownerId>/<repo>@<repoId>:ref:...
  # They are public (GitHub's API shows them) and grant nothing on their own: only a token GitHub signs for
  # this repo's main branch can assume the role.
  GitHubOwnerId:
    Type: String
    Default: '97687268'
    AllowedPattern: '[0-9]+'
    Description: Numeric ID of the repo owner
  GitHubRepoId:
    Type: String
    Default: '1436392110'
    AllowedPattern: '[0-9]+'
    Description: Numeric ID of the repository. IDs never change, even if the repo is renamed
  Branch:
    Type: String
    Default: main
  StackName:
    Type: String
    Default: nb-newcomer-guide
    Description: Name of the app stack in samconfig.toml. IAM permissions are scoped to its roles
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      An AWS account can have only one GitHub OIDC provider. The expense-tracker setup already created it,
      so leave this false in that account; set true only in an account that has never used GitHub OIDC.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-deploy-nb-newcomer-guide
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            # GitHub sends the subject either as repo:owner/repo:ref:... or, for this account, with immutable IDs:
            # repo:owner@<ownerId>/repo@<repoId>:ref:... Either way it must be this repo's deploy branch.
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/${Branch}'
                  - !Join
                    - ''
                    - - 'repo:'
                      - !Select [0, !Split ['/', !Ref GitHubRepo]]
                      - !Sub '@${GitHubOwnerId}/'
                      - !Select [1, !Split ['/', !Ref GitHubRepo]]
                      - !Sub '@${GitHubRepoId}:ref:refs/heads/${Branch}'
      # PowerUserAccess covers CloudFormation, Lambda, S3, CloudFront and Logs but no IAM.
      # IAM rights below are limited to the roles SAM creates for this stack (all prefixed with its name).
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: manage-stack-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${StackName}-*'

Outputs:
  DeployRoleArn:
    Description: Add this as the AWS_DEPLOY_ROLE_ARN secret in GitHub
    Value: !GetAtt DeployRole.Arn
